name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to the same version as .pre-commit-config.yaml. An unpinned
      # install silently follows ruff's latest release, so a new ruff could
      # fail this job on untouched code. Bump both together.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mkdocs.yml declares no plugins that import the package, so rendering
      # the site needs neither the conda environment nor potpourri itself.
      - run: pip install mkdocs mkdocs-material pymdown-extensions mkdocs-bibtex
      # --strict promotes mkdocs warnings (broken internal links, unreadable
      # references, invalid config) to build failures.
      - run: mkdocs build --strict

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yaml
          activate-environment: potpourri_env
          auto-activate-base: false
      - name: Install package
        shell: bash -el {0}
        run: pip install -e ".[dev]"
      - name: Run unit tests (no solver required)
        shell: bash -el {0}
        run: pytest tests/unit_tests/ -m "not integration" -v

  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/installation_with_pip/ -v
