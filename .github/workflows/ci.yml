name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned to the same version as .pre-commit-config.yaml. An unpinned
      # install silently follows ruff's latest release, so a new ruff could
      # fail this job on untouched code. Bump both together.
      - run: pip install ruff==0.16.8
      - run: ruff check .
      - run: ruff format --check .

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "interrogate>=1.7"
      # Coverage: does a docstring exist at all? Scope and threshold
      # come from [tool.interrogate] in pyproject.toml, so this behaves
      # identically here and locally. Structure is checked by the lint
      # job, whose `ruff check` now includes the pydocstyle D rules.
      - run: interrogate src/potpourri
      # The README badge is committed, so it can go stale. Regenerate
      # it and fail if it moved, keeping the measurement authoritative.
      - run: interrogate src/potpourri --generate-badge docs/assets/
          --badge-format svg
      - run: git diff --exit-code -- docs/assets/interrogate_badge.svg

  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The checker enumerates files with git; a shallow checkout is
          # enough, but the submodule is not needed at all.
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The charset-normalizer extra is required, not optional: reuse
      # needs an encoding-detection backend, and a bare `pip install
      # reuse` aborts on import with NoEncodingModuleError wherever
      # libmagic is absent.
      - run: pip install "packaging>=24.2" "reuse[charset-normalizer]"
      # Project policy: SPDX tags in the physical Python header. This job
      # is strictly read-only -- CI never repairs a header.
      - run: python tools/check_license_headers.py
      # Independent cross-check with the REUSE reference implementation.
      - run: git ls-files -z -- '*.py' '*.pyi' '*.pyw' | xargs -0 reuse lint-file

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mkdocs.yml declares no plugins that import the package, so rendering
      # the site needs neither the conda environment nor potpourri itself.
      - run: pip install mkdocs mkdocs-material pymdown-extensions mkdocs-bibtex
      # --strict promotes mkdocs warnings (broken internal links, unreadable
      # references, invalid config) to build failures.
      - run: mkdocs build --strict

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yaml
          activate-environment: potpourri_env
          auto-activate-base: false
      - name: Install package
        shell: bash -el {0}
        run: pip install -e ".[dev]"
      - name: Run unit tests (no solver required)
        shell: bash -el {0}
        run: pytest tests/unit_tests/ -m "not integration" -v

  install-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: pytest tests/installation_with_pip/ -v
