name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION — skipping publish."
            exit 0
          fi
          echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"

      - name: Install uv
        if: env.SHOULD_PUBLISH == 'true'
        run: pip install uv

      - name: Build package
        if: env.SHOULD_PUBLISH == 'true'
        run: uv build

      # Authenticates through PyPI trusted publishing (OIDC) using the
      # `id-token: write` permission above — no API token is involved, so
      # there is nothing to expire, rotate or leak. `always` rather than
      # `automatic` so a missing or misconfigured OIDC setup fails loudly
      # instead of silently falling back to another credential source.
      - name: Publish to PyPI
        if: env.SHOULD_PUBLISH == 'true'
        run: uv publish --trusted-publishing always

  # Archives the tagged source as a new version of the existing Zenodo concept
  # record, so 10.5281/zenodo.20357011 keeps resolving to the newest release
  # and the DOI cited by CITATION.cff, the README and the paper stays valid.
  # Runs only after PyPI succeeded, so a failed publish is not archived.
  zenodo:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      # The script re-reads the tag, refuses to archive a version that is
      # already published, and takes all metadata from CITATION.cff.
      - name: Archive release on Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/zenodo_release.py
