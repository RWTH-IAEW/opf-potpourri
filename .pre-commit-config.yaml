repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.8
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      # Every in-scope Python file must carry an SPDX header, not just
      # the ones touched by this commit -- hence pass_filenames: false
      # and always_run. The hook is read-only; it never repairs a file.
      # See docs/licensing.md.
      - id: license-headers
        name: SPDX licensing headers
        entry: python tools/check_license_headers.py
        language: python
        additional_dependencies: ["packaging>=24.2"]
        pass_filenames: false
        always_run: true

      # Docstring coverage. Ruff's D rules (above) judge the shape of a
      # docstring that exists; interrogate is what notices one missing.
      # Scope and threshold live in [tool.interrogate] in pyproject.toml
      # so this command behaves identically in CI and by hand.
      - id: interrogate
        name: docstring coverage (interrogate)
        entry: interrogate
        args: ["src/potpourri"]
        language: python
        additional_dependencies: ["interrogate>=1.7"]
        pass_filenames: false
        always_run: true
