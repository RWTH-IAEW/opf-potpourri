name: potpourri_env
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
dependencies:
  - python=3.12.16
  - glpk=5.0
  - ipopt=3.14.20
  - ipython=9.18.1
  - numba=0.68.1
  - pip
  - pip:
      # Latest stable compatible versions verified on Python 3.12.
      # pandapower 3.5.6 requires pandas~=2.3 and numpy<2.5, so pandas 3
      # and numpy 2.5 cannot be installed alongside it.
      - pip==26.3
      - geojson==3.3.0
      - gurobipy==14.0.0
      - lightsim2grid==1.3.1
      - loguru==0.8.0
      - matpowercaseframes==2.1.1
      - numpy==2.4.6
      - openpyxl==3.1.5
      - pandapower==3.5.6
      - pandas==2.3.3
      - pyomo==6.10.1
      - scipy==1.18.1
      - simbench==1.6.3
      - tqdm==4.70.1
