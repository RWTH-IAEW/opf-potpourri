site_name: potpourri
site_description: >-
  Multi-Period Optimal Power Flow for Distribution Grids —
  Pyomo models over pandapower networks.
site_author: Steffen Kortmann, IAEW RWTH Aachen University
site_url: https://opf-potpourri.readthedocs.io/
repo_url: https://github.com/RWTH-IAEW/opf-potpourri
repo_name: RWTH-IAEW/opf-potpourri

theme:
  name: readthedocs

# One `plugins:` key only. A second one does not extend this list, it
# replaces it: duplicate mapping keys are legal YAML and the last wins
# silently. That is how the bibtex plugin was lost once already, leaving
# a literal \bibliography on the Scientific Work page while the strict
# build stayed green. tests/unit_tests/test_docs_config.py guards it.
plugins:
  - search
  - bibtex:
      bib_file: "paper.bib"
      # Bracketed [@key] citations are unaffected. Inline (bare) @key parsing
      # runs on the raw markdown before code fences are handled, so a Pyomo
      # decorator such as `@model.Constraint(...)` in a code example is read
      # as a citation key and fails the strict build.
      enable_inline_citations: false
  # API pages are generated from the source docstrings so signatures and
  # descriptions cannot drift away from the code. Google-style sections,
  # matching [tool.ruff.lint.pydocstyle] in pyproject.toml.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              ignore_init_summary: true
              # Keep warn_unknown_params: a documented parameter that no
              # longer exists is a real documentation bug and should fail
              # the strict build. warn_missing_types is off on purpose --
              # this project documents units and meaning in prose, and
              # demanding an annotation on every documented parameter
              # would turn the docs pass into a typing migration.
              warn_unknown_params: true
              warn_missing_types: false
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            inherited_members: false
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Class Architecture: architecture.md
  - Mathematical Modelling:
      - Formulations: mathematical-modelling.md
      - Scientific Work: scientific-work.md
  - User Guide:
      - Single-Period OPF: user-guide/single-period.md
      - Multi-Period OPF: user-guide/multi-period.md
      - Flexible Devices: user-guide/devices.md
      - Reactive-Power Control: user-guide/reactive-power-control.md
      - Solvers: user-guide/solvers.md
      - Logging: user-guide/logging.md
  - Examples:
      - Overview: scripts/examples.md
      - AC Validation: scripts/validation.md
      - PGLib-OPF Benchmark: scripts/pglib-validation.md
      - Load-Case OPF: scripts/loadcases.md
      - Feasible Operation Region: scripts/feasible-operation-region.md
  - API Reference:
      - Single-Period Models: api/models.md
      - Multi-Period Models: api/multi-period.md
      - Flexible Devices: api/devices.md
      - Utilities: api/utilities.md
  - Contributing:
      - Documentation: contributing-docs.md
      - Pyomo Conventions: contributing-pyomo.md
      - Licensing: licensing.md
