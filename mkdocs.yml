site_name: potpourri
site_description: >-
  Multi-Period Optimal Power Flow for Distribution Grids —
  Pyomo models over pandapower networks.
site_author: Steffen Kortmann, IAEW RWTH Aachen University
site_url: https://opf-potpourri.readthedocs.io/
repo_url: https://github.com/RWTH-IAEW/opf-potpourri
repo_name: RWTH-IAEW/opf-potpourri

theme:
  name: readthedocs

plugins:
  - search
  - bibtex:
      bib_file: "paper.bib"
      # Bracketed [@key] citations are unaffected. Inline (bare) @key parsing
      # runs on the raw markdown before code fences are handled, so a Pyomo
      # decorator such as `@model.Constraint(...)` in a code example is read
      # as a citation key and fails the strict build.
      enable_inline_citations: false

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Class Architecture: architecture.md
  - Mathematical Modelling:
      - Formulations: mathematical-modelling.md
      - Scientific Work: scientific-work.md
  - User Guide:
      - Single-Period OPF: user-guide/single-period.md
      - Multi-Period OPF: user-guide/multi-period.md
      - Flexible Devices: user-guide/devices.md
      - Reactive-Power Control: user-guide/reactive-power-control.md
      - Solvers: user-guide/solvers.md
      - Logging: user-guide/logging.md
  - Examples:
      - Overview: scripts/examples.md
      - AC Validation: scripts/validation.md
      - PGLib-OPF Benchmark: scripts/pglib-validation.md
      - Load-Case OPF: scripts/loadcases.md
      - Feasible Operation Region: scripts/feasible-operation-region.md
  - API Reference:
      - Single-Period Models: api/models.md
      - Multi-Period Models: api/multi-period.md
      - Flexible Devices: api/devices.md
      - Utilities: api/utilities.md
