[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opf-potpourri"
version = "0.5.0"
description = "Multi-period Optimal Power Flow for distribution grids with storage — Pyomo models over pandapower networks"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Steffen Kortmann", email = "s.kortmann@iaew.rwth-aachen.de" },
    { name = "Andreas Bong",     email = "a.bong@iaew.rwth-aachen.de" },
    { name = "Simon Braun",      email = "s.braun@iaew.rwth-aachen.de" },
    { name = "Alexander Och",    email = "a.och@iaew.rwth-aachen.de" },
    { name = "Farah Nasr",       email = "f.nasr@iaew.rwth-aachen.de" },
    { name = "Philip Kvesic",    email = "p.kvesic@iaew.rwth-aachen.de" },
    { name = "Nina Stumberger",  email = "n.stumberger@iaew.rwth-aachen.de" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
]
keywords = [
    "power systems",
    "pandapower",
    "optimal power flow",
    "pyomo",
    "distribution grid",
    "multi-period",
    "OPF",
]
dependencies = [
    "loguru>=0.7",
    "matpowercaseframes>=2.1",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openpyxl>=3.1",
    # Upper bound is deliberate: pandapower moves symbols out of its top-level
    # namespace between minor releases (3.5 dropped create_continuous_bus_index
    # and clear_result_tables from it), which breaks model construction and
    # result mapping rather than degrading them. The unit suite is verified on
    # 3.4.0 and 3.5.4; raise the bound after testing the next minor, do not
    # drop it.
    "pandapower>=2.13,<3.6",
    # Same reasoning: pandas 3.0 makes copy-on-write the default, which turns
    # chained assignment into a silent no-op rather than an error. The result
    # mappers were audited for that and use plain assignment, but the bound
    # keeps the next major release from changing results before it is tested.
    "pandas>=2.0,<3",
    "pyomo>=6.10",
    "simbench>=1.4",
]

[project.optional-dependencies]
gurobi = [
    # >=12.0 ships the nonlinear API (gurobipy.nlfunc) that Pyomo's
    # 'gurobi_direct_minlp' interface targets; <12 is limited to degree 2.
    "gurobipy>=12.0",
]
notebooks = [
    "jupyterlab>=4.0",
    "notebook>=7.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocs-bibtex>=4.0",
    # mkdocs.yml enables pymdownx.arithmatex and pymdownx.superfences
    # directly, so declare this rather than relying on mkdocs-material
    # pulling it in transitively.
    "pymdown-extensions>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=4.0",
    # test_q_control.py checks our capability areas against pandapower's own
    # PQVArea classes.  The 4105/4110 ones are shapely polygons, so without
    # shapely those parity tests skip rather than run.
    "shapely>=2.0",
]
performance-test = [
    "perfplot>=0.10.2",
]

[project.urls]
Homepage      = "https://github.com/RWTH-IAEW/opf-potpourri"
Repository    = "https://github.com/RWTH-IAEW/opf-potpourri"
Documentation = "https://opf-potpourri.readthedocs.io/"
"Bug Tracker" = "https://github.com/RWTH-IAEW/opf-potpourri/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"potpourri" = ["data/*.pkl", "data/*.xlsx"]

[tool.ruff]
line-length = 79
# Ruff 0.16 began formatting Python code blocks inside Markdown files. Keep the
# prose, the examples and paper.md as authored; ruff's remit here is the Python
# sources.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's default `select` widened substantially in
# 0.16 and `extend-select` builds on that default, so leaving it implicit made
# the enforced rules change with every ruff release (0.16 silently enabled ~27
# new rule families, including N999, which would demand renaming public modules
# such as ACOPF_base). Widen this list deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F"]
extend-select = ["E501"]
# F403/F405: `from pyomo.environ import *` is standard Pyomo convention.
# E741: single-letter `l` is the standard line-index variable in power systems math.
ignore = ["E741", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py"     = ["E501"]
"tests/**/*.py"    = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require a remote solver or network access",
]
